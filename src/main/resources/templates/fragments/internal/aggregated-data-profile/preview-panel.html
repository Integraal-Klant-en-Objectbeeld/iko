<div id="preview-panel" th:fragment="preview-panel">
    <cds-tile>
        <cds-tabs value="result" type="contained">
            <cds-tab id="tab-result" target="panel-result" value="result">
                Result
            </cds-tab>
            <cds-tab id="tab-trace" target="panel-trace" value="trace">
                Trace
            </cds-tab>
            <cds-tab id="tab-flow" target="panel-flow" value="flow">
                Flow
            </cds-tab>
            <cds-tab
                id="tab-error"
                target="panel-error"
                value="error"
                th:attr="disabled=${exception == null ? 'true' : null}"
            >
                Error
            </cds-tab>
        </cds-tabs>
        <div class="preview-panel-tabs-body">
            <div
                id="panel-result"
                role="tabpanel"
                aria-labelledby="tab-result"
                hidden=""
            >
                <cds-form-group
                    id="form-group-test"
                    name="form-group"
                    class="cds-theme-zone-white"
                    data-carbon-theme="white"
                >
                    <input
                        type="hidden"
                        id="name"
                        name="name"
                        th:value="${form?.name != null ? form.name : aggregatedDataProfile.name}"
                    />
                    <input
                        type="hidden"
                        id="version"
                        name="version"
                        th:value="${form?.version != null ? form.version : aggregatedDataProfile.version}"
                    />
                    <input
                        type="hidden"
                        id="resultTransform"
                        name="resultTransform"
                        value="."
                    />

                    <cds-form-item class="form-actions">
                        <cds-button
                            kind="primary"
                            hx-post="/admin/aggregated-data-profiles/debug"
                            hx-target="#preview-panel"
                            hx-swap="outerHTML"
                            hx-include="[id='endpointTransformContext'], [id='resultTransform'], [id='name'], [id='version']"
                            data-before-request-label="testing"
                        >
                            Get results
                        </cds-button>
                    </cds-form-item>

                    <div class="form-grid debug-grid">
                        <div class="form-column">
                            <label for="endpointTransformContext">
                                <cds-toggletip
                                    alignment="right"
                                    alignment-axis-offset="0"
                                >
                                    Endpoint Transform Context
                                    <p slot="body-text">
                                        Context passed to endpoint
                                        transformations for the ADP root route
                                        and when mapping relation inputs.
                                        <br />
                                        idParam: optional identifier header
                                        derived from incoming ADP requests.
                                        <br />
                                        sortParams: containerId → Pageable pairs
                                        that capture requested paging/sorting
                                        for each container.
                                        <br />
                                        filterParams: containerId → filter map
                                        holding container-specific query filters
                                        submitted by the client.
                                    </p>
                                </cds-toggletip>
                            </label>
                            <cds-form-item
                                th:with='defaultEndpointTransformContext=${&apos;{"idParam": "", "sortParams": {}, "filterParams": {}}&apos;}'
                            >
                                <textarea
                                    id="endpointTransformContext"
                                    name="endpointTransformContext"
                                    hidden
                                    th:value="${endpointTransformContext != null ? endpointTransformContext : defaultEndpointTransformContext}"
                                >
                                </textarea>

                                <!-- Editor container for Endpoint Transform Context -->
                                <div
                                    id="endpointTransformContextEditor"
                                    data-ace
                                    data-language="json"
                                    data-format-json
                                    data-textarea="#endpointTransformContext"
                                    th:data-initial="${endpointTransformContext != null ? endpointTransformContext : defaultEndpointTransformContext}"
                                    data-theme="lightgray-theme"
                                    class="ace-editor-style"
                                ></div>
                            </cds-form-item>
                        </div>

                        <div class="form-column">
                            <label for="testResult">Result</label>
                            <cds-form-item>
                                <textarea
                                    id="testResult"
                                    name="Test result"
                                    hidden
                                    th:value="${testResult}"
                                >
                                </textarea>

                                <!-- Editor container for test result -->
                                <div
                                    id="testResult-editor"
                                    data-readonly="true"
                                    data-ace
                                    data-language="json"
                                    data-textarea="#testResult"
                                    th:data-initial="${testResult}"
                                    data-theme="lightgray-theme"
                                    class="ace-editor-style"
                                ></div>
                            </cds-form-item>
                        </div>
                    </div>
                </cds-form-group>
            </div>
            <div
                id="panel-trace"
                role="tabpanel"
                aria-labelledby="tab-trace"
                hidden=""
            >
                <cds-table>
                    <cds-table-head>
                        <cds-table-header-row>
                            <cds-table-header-cell>ID</cds-table-header-cell>
                            <cds-table-header-cell
                                >Timestamp</cds-table-header-cell
                            >
                            <cds-table-header-cell>Route</cds-table-header-cell>
                            <cds-table-header-cell
                                >Location</cds-table-header-cell
                            >
                            <cds-table-header-cell
                                >Elapsed</cds-table-header-cell
                            >
                            <cds-table-header-cell
                                >Status</cds-table-header-cell
                            >
                        </cds-table-header-row>
                    </cds-table-head>
                    <cds-table-body>
                        <cds-table-row th:each="trace : ${traces}">
                            <cds-table-cell
                                th:text="${trace.id}"
                            ></cds-table-cell>
                            <cds-table-cell
                                th:text="${trace.timestamp}"
                            ></cds-table-cell>
                            <cds-table-cell
                                th:text="${trace.route}"
                            ></cds-table-cell>
                            <cds-table-cell
                                th:text="${trace.location}"
                            ></cds-table-cell>
                            <cds-table-cell
                                th:text="${trace.elapsed}"
                            ></cds-table-cell>
                            <cds-table-cell
                                th:text="${trace.status}"
                                th:class="${trace.status == 'OK' ? 'trace-status-ok' :
                                            trace.status == 'FAILED' ? 'trace-status-failed' :
                                            trace.status == 'IN_PROGRESS' ? 'trace-status-in-progress' : ''}"
                            >
                            </cds-table-cell>
                        </cds-table-row>
                    </cds-table-body>
                </cds-table>
            </div>
            <div
                id="panel-flow"
                role="tabpanel"
                aria-labelledby="tab-flow"
                hidden=""
            >
                <p
                    th:if="${traceGraphJson == null}"
                    class="trace-diagram-empty"
                >
                    Run "Get results" to visualise the trace flow.
                </p>
                <div
                    th:if="${traceGraphJson != null}"
                    class="trace-flow-controls"
                >
                    <span class="trace-flow-controls-label">Detail level</span>
                    <cds-toggle
                        id="trace-flow-mode"
                        size="sm"
                        hide-label
                        label-a="Advanced"
                        label-b="Simple"
                    ></cds-toggle>
                </div>
                <!-- Server-produced graph JSON; th:utext to keep it unescaped
                     (Jackson output, not user HTML). Non-executable. -->
                <script
                    type="application/json"
                    id="trace-graph-data"
                    th:utext="${traceGraphJson != null ? traceGraphJson : '{}'}"
                ></script>
                <div
                    data-trace-diagram="#trace-graph-data"
                    class="trace-diagram"
                ></div>
            </div>
            <div
                id="panel-error"
                role="tabpanel"
                aria-labelledby="tab-error"
                hidden=""
            >
                <h4>Stacktrace:</h4>
                <div
                    id="kotlin-stacktrace-viewer"
                    data-ace
                    data-language="json"
                    data-readonly="true"
                    data-theme="lightgray-theme"
                    th:data-initial="${exception != null ? exception.getStacktrace() : ''}"
                    class="ace-editor-style-full-height"
                ></div>
            </div>
        </div>
    </cds-tile>

    <!-- Detail modal for a clicked Flow node/link. Populated by
         trace-diagram-init.js (openTraceModal). Left = per-step field list;
         right = Input (top) and Output/Response or Error (bottom). -->
    <cds-modal id="trace-step-modal" size="lg">
        <cds-modal-header>
            <cds-modal-close-button></cds-modal-close-button>
            <cds-modal-heading>
                <span id="trace-modal-label"></span>
                <span id="trace-modal-pills"></span>
                <cds-tag
                    id="trace-modal-status"
                    type="gray"
                    size="sm"
                ></cds-tag>
            </cds-modal-heading>
        </cds-modal-header>
        <cds-modal-body>
            <!-- Two tabs inside the modal: step Details (default; per-type fields incl. read-only Ace
                 code viewers) and the raw Exchange input/output (Ace viewers). Each editor owns its own
                 scroll and autosizes, so the modal body never overflows — no fade mask. -->
            <cds-tabs id="trace-modal-tabs" value="details">
                <cds-tab
                    id="trace-modal-tab-details"
                    target="trace-modal-panel-details"
                    value="details"
                >
                    Details
                </cds-tab>
                <cds-tab
                    id="trace-modal-tab-exchange"
                    target="trace-modal-panel-exchange"
                    value="exchange"
                >
                    Exchange
                </cds-tab>
            </cds-tabs>

            <div
                id="trace-modal-panel-details"
                role="tabpanel"
                aria-labelledby="trace-modal-tab-details"
            >
                <!-- Field rows (incl. JQ / context code blocks) built by openTraceModal. -->
                <div id="trace-modal-fields"></div>
            </div>

            <div
                id="trace-modal-panel-exchange"
                role="tabpanel"
                aria-labelledby="trace-modal-tab-exchange"
                hidden=""
            >
                <!-- Both sections use the same label/value grid as the Details tab, filled by
                     openTraceModal (buildDetailGrid). -->
                <div id="trace-modal-input-section">
                    <h5 class="trace-modal-section-title">Exchange input</h5>
                    <div id="trace-modal-input-fields"></div>
                </div>
                <div id="trace-modal-output-section" hidden="">
                    <h5 class="trace-modal-section-title">Exchange output</h5>
                    <div id="trace-modal-output-fields"></div>
                </div>
            </div>
        </cds-modal-body>
        <cds-modal-footer>
            <cds-modal-footer-button kind="primary" data-modal-close>
                Close
            </cds-modal-footer-button>
        </cds-modal-footer>
    </cds-modal>
</div>
