<th:block th:fragment="logging-filter-results">
    <cds-table-body id="log-search-results">
        <cds-table-row th:if="${#lists.isEmpty(events)}" class="not-clickable">
            <cds-table-cell colspan="3"> No log events found </cds-table-cell>
        </cds-table-row>
        <cds-table-row
            th:each="event : ${events}"
            th:attr="hx-get=@{'/admin/logs/' + ${event.eventId}},
                     hx-target='#modal-container',
                     hx-swap='innerHTML'"
            role="link"
            class="app--table-row-clickable"
        >
            <cds-table-cell
                th:text="${#temporals.format(event.timestampDateTime, 'dd-MM-yyyy, HH:mm:ss')}"
                class="col-width-20"
            ></cds-table-cell>
            <cds-table-cell class="col-width-15">
                <cds-tag
                    th:type="${event.level == 'ERROR' ? 'red' :
                               event.level == 'WARN'  ? 'yellow' :
                               event.level == 'INFO'  ? 'blue' :
                               event.level == 'DEBUG' ? 'cool-gray' : 'gray'}"
                    th:text="${event.level}"
                ></cds-tag>
            </cds-table-cell>
            <cds-table-cell
                th:text="${#strings.abbreviate(event.formattedMessage, 200)}"
            ></cds-table-cell>
        </cds-table-row>
    </cds-table-body>
</th:block>
