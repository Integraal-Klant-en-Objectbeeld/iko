server:
    forward-headers-strategy: framework
    servlet:
        session:
            timeout: ${iko.security.admin.session.timeout:30m}
            cookie:
                http-only: true
                same-site: lax
                secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

spring:
    application:
        name: IKO
    data:
        redis:
            host: # ENV
            port: # ENV
        cache:
            type: redis
    thymeleaf: # Thymeleaf
        cache: false
        mode: HTML
        encoding: UTF-8
        prefix: classpath:/templates/
    mvc:
        static-path-pattern: /assets/**
    web:
        resources:
            static-locations: classpath:/static/
            cache:
                period: 0
    jackson:
        date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
        time-zone: UTC
    transaction:
        default-timeout: 600 #seconds = 10min
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.postgresql.Driver
        password: #external
        hikari:
            auto-commit: false
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 500
                prepStmtCacheSqlLimit: 2048
                useServerPrepStmts: true
                characterEncoding: utf8
                useUnicode: true
                useLegacyDatetimeCode: false
                useSSL: false
                useLocalSessionState: true
                rewriteBatchedStatements: true
                cacheResultSetMetadata: true
                cacheServerConfiguration: true
                elideSetAutoCommits: true
                maintainTimeStats: false
                serverTimezone: UTC
                allowPublicKeyRetrieval: true
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        open-in-view: false
        properties:
            hibernate:
                hbm2ddl.auto: none
                generate_statistics: false
                naming-strategy: org.springframework.boot.orm.jpa.hibernate.SpringNamingStrategy
                cache:
                    use_second_level_cache: false
                    use_query_cache: false
                    region.factory_class: org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
                format_sql: true
                jdbc:
                    time_zone: UTC
                connection:
                    provider_disables_autocommit: true
        hibernate:
            ddl-auto: none
    security:
        oauth2:
            client:
                registration:
                    keycloak:
                        provider: keycloak
                        authorization-grant-type: authorization_code
                        scope: openid
                        client-id: # ENV
                        client-secret: # ENV
                provider:
                    keycloak:
                        issuer-uri: # ENV
            resourceserver:
                jwt:
                    issuer-uri: # ENV
                    audiences: iko
                    authority-prefix:
                    authorities-claim-name: "[resource_access][iko][roles]"

management:
    endpoints:
        web:
            exposure:
                include: "health,info,prometheus"
            base-path: /actuator
    endpoint:
        health:
            show-details: when_authorized
        prometheus:
            enabled: true

info:
    app:
        description: "Integraal Klant & Objectbeeld (IKO)"

camel:
    yaml:
        routes:
            enabled: true
            paths: classpath:camel/*.yaml
    main:
        tracing: false # for debugging
    trace:
        enabled: false
        standby: true
        backlog-size: 1000
        remove-on-dump: true
        trace-pattern: "*"

iko:
    logging:
        retention: ${IKO_LOGGING_RETENTION:21d}
        deletionCron: ${IKO_LOGGING_DELETIONCRON:0 0 4 * * ?}
        db:
            enabled: ${IKO_LOGGING_DB_ENABLED:false}
    security:
        admin:
            rolesClaim: "roles"
            authorities: "ROLE_ADMIN"
            session:
                timeout: 30m
                warning-before: 2m
    crypto:
        key: # ENV var

logging:
    level:
        org.apache.camel.component.http: INFO
        org.apache.camel.component.rest: INFO
        org.apache.camel.component.rest.openapi: INFO
        org.apache.hc.client5.http: INFO
        org.apache.hc.client5.http.wire: INFO
        org.apache.hc.client5.http.headers: INFO